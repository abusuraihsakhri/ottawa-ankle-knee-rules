version: '3.8'

services:
  ottawa-ankle-knee-rules:
    build: .
    container_name: ottawa-ankle-knee-rules
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=ottawa-ankle-knee-rules-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
