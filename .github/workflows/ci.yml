name: Test and security checks
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    env:
      AUDIT_SECRET_KEY: ci-only-test-key-not-for-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Python dependencies
        run: |
          python -m pip install -r requirements-dev.txt
          python -m pip check
      - name: Python compile and tests
        run: |
          python -m compileall -q clinical_rules.py ottawa_rules.py agents enrichment.py cli.py simulator.py
          python -m pytest -q
      - name: Browser logic and syntax
        run: |
          node --check web/app.js
          node web/app.test.js
      - name: Smoke-test static website
        run: |
          python -m http.server 8765 --directory web >/tmp/ottawa-web.log 2>&1 &
          sleep 1
          curl -fsS http://127.0.0.1:8765/ | grep -q 'Ottawa Ankle'
          curl -fsS http://127.0.0.1:8765/app.js | grep -q 'function evaluate'
